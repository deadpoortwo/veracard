services:
  - type: web
    name: veracard-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/veracard.sqlite
      - key: DYNAMIC_ENVIRONMENT_ID
        value: de749482-b795-4fa4-b95d-03cb47e0c972
      - key: DYNAMIC_ALLOWED_ORIGINS
        value: https://deadpoortwo.github.io,http://localhost:4173,http://127.0.0.1:4173
      - key: CORS_ALLOWED_ORIGINS
        value: https://deadpoortwo.github.io
      - key: BSC_RPC_URL
        value: https://bsc-rpc.publicnode.com
      - key: ETH_RPC_URL
        value: https://ethereum-rpc.publicnode.com
